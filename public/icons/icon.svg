<!--
  EdgeQuant's mark, and the source of truth for every raster icon in this folder.

  A block outline with a rising candle sequence inside it: on-chain, and priced. Deliberately nothing
  like the football mark the other two apps share — this app was scaffolded from PitchEdge and inherited
  its icons byte for byte, which is why it looked like the wrong app on the home screen.

  Regenerate the PNGs with:  npm run icons
-->
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#131D33"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#tile)"/>

  <g id="glyph">
    <!-- the block -->
    <path d="M256 70 L417 163 L417 349 L256 442 L95 349 L95 163 Z"
          stroke="#7DD3FC" stroke-opacity="0.45" stroke-width="14" stroke-linejoin="round"/>

    <!-- three closes, the last one higher than the first. Heavy enough to survive a 192px tile. -->
    <g stroke-linecap="round">
      <path d="M168 236 V368" stroke="#F43F5E" stroke-width="13"/>
      <rect x="142" y="266" width="52" height="76" rx="11" fill="#F43F5E"/>

      <path d="M256 194 V322" stroke="#C8F542" stroke-width="13"/>
      <rect x="230" y="218" width="52" height="82" rx="11" fill="#C8F542"/>

      <path d="M344 136 V272" stroke="#C8F542" stroke-width="13"/>
      <rect x="318" y="160" width="52" height="92" rx="11" fill="#C8F542"/>
    </g>
  </g>
</svg>
